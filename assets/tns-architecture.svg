<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Token Never Sleeps Architecture</title>
  <desc id="desc">A diagram showing task and config files feeding a runner, which orchestrates executor and verifier agents in a loop with handoff state, quota monitoring, and notifications.</desc>
  <rect width="1600" height="900" rx="36" fill="#171311"/>
  <rect x="30" y="30" width="1540" height="840" rx="28" fill="url(#bg)"/>
  <g opacity="0.28">
    <circle cx="210" cy="140" r="220" fill="#C66E42"/>
    <circle cx="1370" cy="110" r="180" fill="#4A6B65"/>
    <circle cx="1280" cy="760" r="220" fill="#8C3C22"/>
  </g>

  <rect x="110" y="176" width="272" height="160" rx="24" fill="#FFF9F1" fill-opacity="0.9"/>
  <text x="146" y="228" fill="#7F2F12" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1.8">INPUTS</text>
  <text x="146" y="274" fill="#181412" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="700">task.md</text>
  <text x="146" y="314" fill="#6B625A" font-family="Manrope, Arial, sans-serif" font-size="24">Tracked sections and</text>
  <text x="146" y="344" fill="#6B625A" font-family="Manrope, Arial, sans-serif" font-size="24">incremental goals</text>

  <rect x="110" y="378" width="272" height="160" rx="24" fill="#FFF9F1" fill-opacity="0.9"/>
  <text x="146" y="430" fill="#7F2F12" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1.8">CONFIG</text>
  <text x="146" y="476" fill="#181412" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="700">tns_config.json</text>
  <text x="146" y="516" fill="#6B625A" font-family="Manrope, Arial, sans-serif" font-size="24">Workspace, workflow,</text>
  <text x="146" y="546" fill="#6B625A" font-family="Manrope, Arial, sans-serif" font-size="24">quota and notifications</text>

  <rect x="516" y="242" width="580" height="404" rx="34" fill="#FFF7ED" fill-opacity="0.96" stroke="#D7C8B5"/>
  <text x="564" y="306" fill="#7F2F12" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2.2">CORE RUNTIME</text>
  <text x="564" y="370" fill="#181412" font-family="Newsreader, Georgia, serif" font-size="64" font-weight="700">TNS Runner</text>
  <text x="564" y="420" fill="#6B625A" font-family="Manrope, Arial, sans-serif" font-size="28">External orchestration loop that survives</text>
  <text x="564" y="456" fill="#6B625A" font-family="Manrope, Arial, sans-serif" font-size="28">session boundaries and usage limits.</text>

  <rect x="568" y="508" width="208" height="88" rx="20" fill="#1F1A17"/>
  <text x="618" y="562" fill="#F8EFE5" font-family="Manrope, Arial, sans-serif" font-size="28" font-weight="700">executor</text>

  <rect x="836" y="508" width="208" height="88" rx="20" fill="#B44F2A"/>
  <text x="888" y="562" fill="#FFF7F1" font-family="Manrope, Arial, sans-serif" font-size="28" font-weight="700">verifier</text>

  <path d="M396 256C444 256 472 256 500 292" stroke="#D18B68" stroke-width="10" stroke-linecap="round"/>
  <path d="M396 458C444 458 468 458 500 418" stroke="#D18B68" stroke-width="10" stroke-linecap="round"/>

  <path d="M782 552H826" stroke="#6B625A" stroke-width="10" stroke-linecap="round"/>
  <path d="M810 532L842 552L810 572" fill="#6B625A"/>
  <path d="M940 618C940 696 700 708 700 626" stroke="#C66E42" stroke-width="10" stroke-linecap="round"/>
  <path d="M684 644L700 612L718 642" fill="#C66E42"/>
  <text x="704" y="734" fill="#7F2F12" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="700">pass -> done</text>
  <text x="894" y="734" fill="#7F2F12" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="700">fail -> needs_fix</text>

  <rect x="1160" y="166" width="316" height="160" rx="24" fill="#FFF9F1" fill-opacity="0.88"/>
  <text x="1196" y="218" fill="#7F2F12" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1.8">STATE</text>
  <text x="1196" y="264" fill="#181412" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="700">handoff + activity</text>
  <text x="1196" y="304" fill="#6B625A" font-family="Manrope, Arial, sans-serif" font-size="24">Fresh-context continuation</text>

  <rect x="1160" y="374" width="316" height="160" rx="24" fill="#FFF9F1" fill-opacity="0.88"/>
  <text x="1196" y="426" fill="#7F2F12" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1.8">QUOTA</text>
  <text x="1196" y="472" fill="#181412" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="700">usage window</text>
  <text x="1196" y="512" fill="#6B625A" font-family="Manrope, Arial, sans-serif" font-size="24">rolling usage / provider</text>

  <rect x="1160" y="582" width="316" height="160" rx="24" fill="#FFF9F1" fill-opacity="0.88"/>
  <text x="1196" y="634" fill="#7F2F12" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1.8">NOTIFY</text>
  <text x="1196" y="680" fill="#181412" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="700">remote reports</text>
  <text x="1196" y="720" fill="#6B625A" font-family="Manrope, Arial, sans-serif" font-size="24">Email / Telegram / LINE</text>

  <path d="M1108 286H1140" stroke="#D18B68" stroke-width="10" stroke-linecap="round"/>
  <path d="M1108 454H1140" stroke="#D18B68" stroke-width="10" stroke-linecap="round"/>
  <path d="M1108 622H1140" stroke="#D18B68" stroke-width="10" stroke-linecap="round"/>

  <defs>
    <linearGradient id="bg" x1="82" y1="44" x2="1492" y2="846" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF6EE"/>
      <stop offset="1" stop-color="#F0E7D9"/>
    </linearGradient>
  </defs>
</svg>
